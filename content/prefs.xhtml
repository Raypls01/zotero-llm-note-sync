<vbox
  id="llm-notesync-prefs"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <linkset></linkset>

  <groupbox>
    <caption><label>自动检查</label></caption>
    <hbox align="center" style="margin:6px 0">
      <label control="pref-pollIntervalInput" style="min-width:110px">检查间隔（秒）</label>
      <html:input type="number" id="pref-pollIntervalInput"
        min="10" max="3600" step="5"
        style="width:80px;padding:3px 6px;border:1px solid #aaa;border-radius:4px"/>
      <html:span style="font-size:0.85em;color:#888;margin-left:8px">（10–3600）</html:span>
    </hbox>
  </groupbox>

  <groupbox>
    <caption><label>笔记格式</label></caption>
    <hbox align="center" style="margin:4px 0">
      <label control="pref-appendPosition" style="min-width:110px">追加位置</label>
      <menulist id="pref-appendPosition">
        <menupopup>
          <menuitem value="bottom" label="追加到笔记末尾"/>
          <menuitem value="top" label="插入到笔记开头"/>
        </menupopup>
      </menulist>
    </hbox>
    <checkbox id="pref-includeModel" label="显示模型名称"/>
    <checkbox id="pref-includeHeadingTimestamp" label="显示对话日期标题"/>
  </groupbox>

  <groupbox>
    <caption><label>操作</label></caption>
    <hbox align="center" style="margin:6px 0">
      <button id="llm-notesync-save-btn" label="保存全部设置" style="min-width:120px"/>
      <html:span id="llm-notesync-save-msg" style="margin-left:12px;font-weight:bold;font-size:0.95em;color:green;display:none">✓ 已保存</html:span>
    </hbox>
  </groupbox>

  <groupbox>
    <caption><label>状态</label></caption>
    <hbox align="center" style="margin:6px 0">
      <html:span id="llm-notesync-status" style="font-weight:bold">加载中…</html:span>
    </hbox>
    <hbox align="center" style="margin:4px 0">
      <button id="llm-notesync-run-now" label="立即运行批量追加" style="min-width:140px"/>
    </hbox>
  </groupbox>

  <!-- 注释：脚本由 bootstrap.js 的窗口监听器注入，不在 XUL 中执行 -->
</vbox>
